product-id: 901
comment: Iris Bar Chart for Tiptoi
init: $var := 0
welcome: welcome, next
language: en

scripts:
  area_IRIS_SETOSA:
    - $species := 1 P(setosa_prompt)

  area_IRIS_VERSICOLOR:
    - $species := 2 P(versicolor_prompt)

  area_IRIS_VIRGINICA:
    - $species := 3 P(virginica_prompt)

  area_outside_bars:
    - P(outside_bars_prompt) J(reset)

  bar_IRIS_SETOSA_SEPAL_WIDTH:
    - P(bar_IRIS_SETOSA_SEPAL_WIDTH) J(area_IRIS_SETOSA)

  bar_IRIS_VERSICOLOR_SEPAL_WIDTH:
    - P(bar_IRIS_VERSICOLOR_SEPAL_WIDTH) J(area_IRIS_SETOSA)

  bar_IRIS_VIRGINICA_SEPAL_WIDTH:
    - P(bar_IRIS_VIRGINICA_SEPAL_WIDTH) J(next)

  bar_IRIS_SETOSA_SEPAL_LENGTH:
    - P(bar_IRIS_SETOSA_SEPAL_LENGTH) J(next)

  bar_IRIS_VERSICOLOR_SEPAL_LENGTH:
    - P(bar_IRIS_VERSICOLOR_SEPAL_LENGTH) J(next)

  bar_IRIS_VIRGINICA_SEPAL_LENGTH:
    - P(bar_IRIS_VIRGINICA_SEPAL_LENGTH) J(next)

  reset: $species := $var 
  next: $species := $var P(next)


speak:
  welcome: "Welcome to the Iris Bar Chart interactive experience."
  setosa_prompt: "You are in the Iris-setosa column. Press on a bar to hear the values."
  versicolor_prompt: "You are in the Iris-versicolor column. Press on a bar to hear the values."
  virginica_prompt: "You are in the Iris-virginica column. Press on a bar to hear the values."
  outside_bars_prompt: "You are outside the bar areas. Please touch one of the species bars to explore."
  bar_IRIS_SETOSA_SEPAL_WIDTH: "This bar represents the sum of Sepal Width for Iris-setosa. The value is 170.9 centimeters."
  bar_IRIS_VERSICOLOR_SEPAL_WIDTH: "This bar represents the sum of Sepal Width for Iris-versicolor. The value is 138.5 centimeters."
  bar_IRIS_VIRGINICA_SEPAL_WIDTH: "This bar represents the sum of Sepal Width for Iris-virginica. The value is 148.7 centimeters."
  bar_IRIS_SETOSA_SEPAL_LENGTH: "This bar represents the sum of Sepal Length for Iris-setosa. The value is 250.3 centimeters."
  bar_IRIS_VERSICOLOR_SEPAL_LENGTH: "This bar represents the sum of Sepal Length for Iris-versicolor. The value is 296.8 centimeters."
  bar_IRIS_VIRGINICA_SEPAL_LENGTH: "This bar represents the sum of Sepal Length for Iris-virginica. The value is 329.4 centimeters."
  next: "Touch the area for the species you want to explore."
